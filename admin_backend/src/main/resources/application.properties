# ========== 应用配置 ==========
spring.application.name=admin_backend
server.port=8080

# ========== MySQL 数据源（请按实际环境修改） ==========
spring.datasource.url=jdbc:mysql://localhost:3306/admin_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== MyBatis-Plus 配置 ==========
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ========== JSON 日期格式 ==========
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai

# ========== JWT 配置 ==========
jwt.secret=admin-platform-secret-key-2024-please-change-in-production
jwt.expiration=86400000

spring.main.allow-bean-definition-overriding=true

spring.main.allow-bean-definition-overriding=true
